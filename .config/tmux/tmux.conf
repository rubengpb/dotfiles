# Set zsh as shell
set-option -g default-shell /bin/zsh

# Set true color
set-option -sa terminal-overrides ",xterm*:Tc"

set -g mouse on

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Set send to inner session (for ssh connection with tmux)
bind-key b send-prefix


# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Set theme
set -g @rose_pine_variant 'main'

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set vi-mode
set-window-option -g mode-keys vi

## Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Swap the defaults: o enters copy-mode, [ cycles to the next pane
bind o copy-mode
bind [ select-pane -t :.+

# Sessionizer: one session per project (absolute path: the server's PATH may lack ~/.local/bin)
bind f display-popup -E -w 40% -h 30% '$HOME/.local/bin/tmux-sessionizer'
bind -n M-1 run-shell '$HOME/.local/bin/tmux-sessionizer aura'
bind -n M-2 run-shell '$HOME/.local/bin/tmux-sessionizer personal'
bind -n M-3 run-shell '$HOME/.local/bin/tmux-sessionizer tfg'
bind -n M-4 run-shell '$HOME/.local/bin/tmux-sessionizer normal'
bind -n M-5 run-shell '$HOME/.local/bin/tmux-sessionizer dotfiles'
bind -r L switch-client -l
bind s choose-tree -Zs

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

run "~/.config/tmux/plugins/tpm/tpm"
