<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Alacritty can't render COLRv1; use the CBDT build in ~/.local/share/fonts -->
  <selectfont>
    <rejectfont><glob>/usr/share/fonts/google-noto-color-emoji-fonts/Noto-COLRv1.ttf</glob></rejectfont>
  </selectfont>
  <alias binding="strong">
    <family>0xProto Nerd Font Mono</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
</fontconfig>
